<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}SNS App{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
    <!-- Google Fonts (Gudea) の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gudea:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/color.css') }}">
    {% block page_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
